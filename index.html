      function showTooltips(e, msg) {
        const c = document.getElementById("tooltips");

        const rect = x.getBoundingClientRect();
        // console.log("debug 5 ", rect );

        c.style.left = (rect.x + rect.width) + 'px';
        c.style.top = (rect.y + rect.height) + 'px';
        c.style.display = "block";

        setTimeout(() => {

      function calcDuration(start, finish) {
        if (start == null) return 0;

        if (finish === null) finish = new Date();

        const date1 = new Date(start);
        const date2 = new Date(finish);

        const difference = date2.getTime() - date1.getTime(); // This will give difference in milliseconds

        const minutes = Math.floor(difference / 60000);
        const secs = Math.round((difference - minutes * 60000) / 1000);

        const hour = Math.floor(minutes / 60);
        const minutes2 = minutes - hour * 60;
        return right("00" + hour, 2) + ":" + right("00" + minutes2, 2) + ":" +
                right("00" + secs, 2);
      }

      function right(s, len) {
        return s.slice(0 - len);
      }

      function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          const r = Math.random() * 16 | 0;
          const v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }

          const difference = date2.getTime() - date1.getTime(); // This will give difference in milliseconds
          return Math.round(difference / 60000);
        } catch (e) {
          return 60;
        }
      }

      function copyToClipboard(text) {
        try {
          navigator.clipboard.writeText(text);
          return showSnackbar("payload copied", 500);
        } catch (err) {
          console.log("error copy", err);
        }

        if (window.clipboardData && window.clipboardData.setData) {
          try {
            window.clipboardData.setData("Text", text);
            return showSnackbar("payload copied", 500);
          } catch (err) {
            console.log("error copy", err);
          }
        }
        return showSnackbar("failed copy payload", 500);
      }

      function getBrowser() {
        var isAndroid = navigator.userAgent.toLowerCase().indexOf('android') !== -1;
        var isGoogleBot = navigator.userAgent.toLowerCase().indexOf('googlebot') !== -1;
        // eslint-disable-next-line
        var isIE = /*@cc_on!@*/false || !!document.documentMode;
        var isEdge = !isIE && !!window.StyleMedia;
        var isFirefox = typeof InstallTrigger !== 'undefined';
        var isOpera = !!window.opr && !!window.opr.addons || !!window.opera || navigator.userAgent.indexOf(' OPR/') >= 0;
        var isChrome = !isGoogleBot && !isEdge && !isOpera && !!window.chrome && (!!window.chrome.webstore || navigator.vendor.toLowerCase().indexOf('google inc.') !== -1);
        var isSafari = !isChrome && navigator.userAgent.toLowerCase().indexOf('safari') !== -1;
        var isBlink = (isChrome || isOpera) && !!window.CSS;
        var browser = void 0;

        if (isIE) {
          browser = 'IE';
        } else if (isEdge) {
          browser = 'Edge';
        } else if (isFirefox) {
          browser = 'Firefox';
        } else if (isOpera) {
          browser = 'Opera';
        } else if (isChrome) {
          browser = 'Chrome';
        } else if (isSafari) {
          browser = 'Safari';
        } else if (isBlink) {
          browser = 'Blink';
        } else if (isGoogleBot) {
          browser = 'Googlebot';
        } else {
          browser = 'Unknown';
        }

        return browser;
      }

      function getPlatform() {
        const userAgent = window.navigator.userAgent,
                platform = window.navigator?.userAgentData?.platform || window.navigator.platform,
                macosPlatforms = ['macOS', 'Macintosh', 'MacIntel', 'MacPPC', 'Mac68K'],
                windowsPlatforms = ['Win32', 'Win64', 'Windows', 'WinCE'],
                iosPlatforms = ['iPhone', 'iPad', 'iPod'];
        let os = null;

        if (macosPlatforms.indexOf(platform) !== -1) {
          os = 'Mac OS';
        } else if (iosPlatforms.indexOf(platform) !== -1) {
          os = 'iOS';
        } else if (windowsPlatforms.indexOf(platform) !== -1) {
          os = 'Windows';
        } else if (/Android/.test(userAgent)) {
          os = 'Android';
        } else if (/Linux/.test(platform)) {
          os = 'Linux';
        }

        return os;
      }

      function digitsOnly(str){

      function secondsToHms(totalSeconds) {
        const hours = Math.floor(totalSeconds / 3600);
        let remainingSeconds = totalSeconds % 3600;
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;

        // Optional: Add leading zeros for formatting (e.g., 05:03:01)
        const formattedHours = String(hours).padStart(2, '0');
        const formattedMinutes = String(minutes).padStart(2, '0');
        const formattedSeconds = String(seconds).padStart(2, '0');

        return `${formattedHours}:${formattedMinutes}:${formattedSeconds}`;
      }

      function isEnableComponent(permissions, pageName, componentName, partial = true) {
        // console.log("finding ", pageName, componentName);
        if (permissions === null) return true;
        const menu = permissions.filter(e => sameString(e.menu,pageName));
        // console.log(JSON.stringify(menu));
        // console.log(JSON.stringify(menu.length));
        if (menu===undefined||menu===null) return true;
        if (menu.length===0) return false;
        const allowed = menu[0].allowed;
        // console.log(JSON.stringify(allowed));
        let found = false;
        allowed.map((item) => {
          // console.log(JSON.stringify(item));
          if (!partial && sameString(item,componentName)) {
            found = true;
            return;
          }
          if (partial && item.toString().toLowerCase().includes(componentName.toString().toLowerCase())) {
            found = true;
            return;
          }
        })
        return found;
      }

      const binaryOperator = (operator) => {
        try {
          const x = operator.toUpperCase();
          if (x.includes('BETWEEN')) return true;
          if (x.includes('+')) return true;
          if (x.includes('-')) return true;
          if (x.includes('*')) return true;
          if (x.includes('/')) return true;
          return false;
        } catch (e) {
          return false;
        }
      }

      const doSortingData = (sortingData, column, asc = true) => {
        if (asc) {
          return sortingData
                  .slice()
                  .sort((a, b) => {
                    try {
                      if ((a[column] === null) || (b[column] == null)) return 1;
                      if (a[column].toUpperCase() < b[column].toUpperCase()) return -1;
                    } catch (err) {
                      try {
                        if (parseInt(a[column]) < parseInt(b[column])) return -1;
                      } catch (err2) {
                        // return 1;
                      }
                    }
                    return 1;
                  });
        } else {
          return sortingData
                  .slice()
                  .sort((a, b) => {
                    try {
                      if ((a[column] === null) || (b[column] == null)) return -1;
                      if (a[column].toUpperCase() < b[column].toUpperCase()) return 1;
                    } catch (err) {
                      try {
                        if (parseInt(a[column]) < parseInt(b[column])) return -1;
                      } catch (err2) {
                        // return -1;
                      }
                    }
                    return -1;
                  });
        }
      }

      const doFilterData = (data, listfilter) => {
        const datatemp = [];
        const keys = Object.keys(listfilter);
        if (keys.length>0) {
          data.map( e => {
            let f = true;
            keys.forEach(function(key) {
              if (listfilter[key]==='' || listfilter[key]===null) return;
              if (e[key]===undefined || e[key]===null) {
                f = false; return;
              }
              try {
                const val1 = e[key].toString().toUpperCase();
                const val2 = listfilter[key].toString().toUpperCase();
                if (val1.includes(val2) === false) {    //not includes
                  f = false;
                  return;
                }
              } catch (err) {
                f = false;
                return;
              }
            })
            if (f) datatemp.push(e);
          });
        } else {
          datatemp.push(...data);
        }
        return datatemp;
      }

      function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        d.setTime(d.getTime() + (exdays*24*60*60*1000));
        let expires = "expires="+ d.toUTCString();
        document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
      }

      function getCookie(cname) {
        let name = cname + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(';');
        for(let i = 0; i <ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) == ' ') {
            c = c.substring(1);
          }
          if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
          }
        }
        return "";
      }

      function clearAllCookies() {
        var cookies = document.cookie.split(";");

        for (var i = 0; i < cookies.length; i++) {
          var cookie = cookies[i];
          var eqPos = cookie.indexOf("=");
          var name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
          // Use a past date for expiration
          document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
        }
      }
